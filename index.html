<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111111;
  --mid:#767676;
  --line:#e6e6e6;
  --wash:#f7f7f6;
  --max:1280px;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#fff;color:var(--ink);line-height:1.6;letter-spacing:-0.015em;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul,ol{list-style:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 32px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mid)}
.display{font-weight:800;line-height:1.1;letter-spacing:-0.042em;font-size:clamp(2.3rem,5.8vw,5rem)}
.sect-head{padding-bottom:20px;border-bottom:1px solid var(--ink);margin-bottom:44px}
.sect-title{font-size:clamp(1.55rem,3.3vw,2.5rem);font-weight:800;letter-spacing:-0.035em;line-height:1.15;margin-top:6px}
.sect-title em{font-style:normal;color:var(--mid);font-weight:500}
section{padding:112px 0}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:100;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
header.solid{background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-color:var(--line)}
.nav{max-width:var(--max);margin:0 auto;padding:0 32px;height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:-0.03em;flex:0 0 auto}
.logo img{height:26px;width:auto}
.logo small{font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--mid)}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-links a{font-size:13.5px;font-weight:600;color:#3f3f3f;transition:color .2s;white-space:nowrap}
.nav-links a:hover{color:var(--ink)}
.nav-cta{border:1px solid var(--ink);padding:9px 17px;font-size:12.5px;font-weight:700;transition:.2s;white-space:nowrap}
.nav-cta:hover{background:var(--ink);color:#fff}
.burger{display:none;width:26px;height:16px;position:relative;flex:0 0 auto}
.burger i{position:absolute;left:0;width:100%;height:1.5px;background:var(--ink);transition:.3s}
.burger i:nth-child(1){top:0}
.burger i:nth-child(2){bottom:0}
.burger.on i:nth-child(1){top:7px;transform:rotate(45deg)}
.burger.on i:nth-child(2){bottom:7px;transform:rotate(-45deg)}
.mmenu{position:fixed;top:70px;left:0;right:0;background:#fff;z-index:99;border-bottom:1px solid var(--line);padding:8px 32px 28px;display:none;flex-direction:column}
.mmenu.on{display:flex}
.mmenu a{padding:15px 0;font-size:18px;font-weight:700;border-bottom:1px solid var(--line)}

/* HERO */
.hero{padding:164px 0 0}
.hero .display{margin-top:16px;white-space:pre-line}
.hero-sub{margin-top:30px;font-size:clamp(15px,1.6vw,17px);color:var(--mid);line-height:1.85;white-space:pre-line;max-width:560px}
.hero-actions{display:flex;gap:10px;margin-top:38px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 27px;font-size:14px;font-weight:700;border:1px solid var(--ink);transition:.22s}
.btn-fill{background:var(--ink);color:#fff}
.btn-fill:hover{opacity:.84}
.btn-line:hover{background:var(--ink);color:#fff}

/* REEL */
.reel{position:relative;margin-top:76px;width:100%;aspect-ratio:21/9;background:#111;overflow:hidden;cursor:pointer}
.reel img{width:100%;height:100%;object-fit:cover;opacity:.92;transition:transform .8s cubic-bezier(.22,1,.36,1)}
.reel:hover img{transform:scale(1.03)}
.reel::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.5))}
.reel-label{position:absolute;left:28px;bottom:26px;z-index:2;color:#fff;display:flex;align-items:center;gap:14px;right:28px}
.reel-play{width:46px;height:46px;border:1px solid rgba(255,255,255,.8);display:grid;place-items:center;flex:0 0 auto;transition:.25s}
.reel:hover .reel-play{background:#fff;color:#111}
.reel-play svg{width:13px;height:13px;fill:currentColor}
.reel-txt small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.82}
.reel-txt b{display:block;font-size:14.5px;font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){.reel{aspect-ratio:16/10}}

/* STATS */
.stats{margin-top:88px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:30px 0 32px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{display:block;font-size:clamp(1.6rem,3.2vw,2.4rem);font-weight:800;letter-spacing:-0.045em;line-height:1}
.stat small{display:block;margin-top:9px;font-size:12.5px;color:var(--mid);font-weight:500}
@media(max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{border-bottom:1px solid var(--line);padding-left:2px}
  .stat:nth-child(2n){border-right:none}
}

/* WORK */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:38px}
.filters button{padding:9px 16px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--mid);transition:.2s}
.filters button:hover{border-color:var(--ink);color:var(--ink)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cat-note{font-size:14px;color:var(--mid);margin:-22px 0 32px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px 26px}
.card{cursor:pointer}
.card-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#ececec}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.card:hover .card-thumb img{transform:scale(1.05)}
.card-thumb::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0);transition:.35s}
.card:hover .card-thumb::after{background:rgba(0,0,0,.24)}
.card-ico{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);width:50px;height:50px;border:1px solid rgba(255,255,255,.85);border-radius:50%;display:grid;place-items:center;opacity:0;transition:.35s;z-index:2}
.card:hover .card-ico{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card-ico svg{width:12px;height:12px;fill:#fff}
.tag{display:block;margin-top:15px;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--mid)}
.card h3{margin-top:6px;font-size:15.5px;font-weight:700;line-height:1.5;letter-spacing:-0.022em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more-wrap{margin-top:58px;text-align:center}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr);gap:36px 18px}}
@media(max-width:620px){.grid{grid-template-columns:1fr;gap:32px}}

/* SERVICE */
#services{background:var(--wash)}
.svc-list{border-top:1px solid var(--line)}
.svc{display:grid;grid-template-columns:70px 1fr 1.3fr;gap:26px;align-items:start;padding:34px 0;border-bottom:1px solid var(--line)}
.svc-no{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--mid);padding-top:7px}
.svc h3{font-size:clamp(1.12rem,2vw,1.5rem);font-weight:800;letter-spacing:-0.03em}
.svc-tag{display:inline-block;margin-top:9px;font-size:11.5px;font-weight:600;color:var(--mid);border:1px solid var(--line);padding:4px 10px;background:#fff}
.svc p{font-size:14.5px;color:var(--mid);line-height:1.85}
@media(max-width:780px){.svc{grid-template-columns:1fr;gap:9px;padding:26px 0}.svc-no{padding-top:0}}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.about-grid .body{font-size:16px;color:#363636;line-height:1.95;white-space:pre-line}
.kit{border-top:1px solid var(--line)}
.kit div{display:flex;justify-content:space-between;gap:18px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px}
.kit span{color:var(--mid);flex:0 0 auto}
.kit b{font-weight:700;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chips li{padding:9px 16px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:#444}
@media(max-width:880px){.about-grid{grid-template-columns:1fr;gap:40px}}

/* CONTACT */
#contact{background:var(--ink);color:#fff;padding:122px 0}
#contact .sect-head{border-color:rgba(255,255,255,.34)}
#contact .eyebrow{color:rgba(255,255,255,.55)}
.contact-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:start}
.contact-grid .display{font-size:clamp(1.95rem,4.4vw,3.4rem);white-space:pre-line}
.contact-sub{margin-top:22px;color:rgba(255,255,255,.64);font-size:15.5px;line-height:1.85;white-space:pre-line}
.crows{border-top:1px solid rgba(255,255,255,.22)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:21px 0;border-bottom:1px solid rgba(255,255,255,.22)}
.crow small{font-size:11px;letter-spacing:.15em;color:rgba(255,255,255,.5)}
.crow b{display:block;font-size:16.5px;font-weight:700;margin-top:5px;letter-spacing:-0.012em}
a.crow:hover b{text-decoration:underline;text-underline-offset:4px}
.crow .arw{opacity:.5}
.btn-white{background:#fff;color:#111;border-color:#fff;margin-top:34px}
.btn-white:hover{opacity:.84}
@media(max-width:880px){.contact-grid{grid-template-columns:1fr;gap:44px}}

footer{padding:32px 0;font-size:12.5px;color:var(--mid)}
.foot-in{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* MODAL */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.95);display:none;place-items:center;padding:22px}
.modal.on{display:grid}
.modal-in{width:100%;max-width:1120px}
.modal-frame{position:relative;aspect-ratio:16/9;background:#000}
.modal-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal-title{color:#fff;font-size:14.5px;font-weight:600;margin-top:15px}
.modal-close{position:absolute;top:20px;right:24px;color:#fff;font-size:30px;line-height:1;opacity:.7}
.modal-close:hover{opacity:1}

/* REVEAL */
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
.skel{color:var(--mid);font-size:14px;padding:40px 0}

@media(max-width:880px){
  .wrap,.nav,.mmenu{padding-left:20px;padding-right:20px}
  .nav-links{display:none}
  .burger{display:block}
  .hero{padding-top:120px}
  section{padding:80px 0}
}
</style>
</head>
<body>

<header id="hdr">

  <div class="wrap">

오래 기억되는

<script>
/* ========= 기존 dsfilm_data.json 을 그대로 읽습니다 ========= */
const DATA_URL = 'dsfilm_data.json';
const PER = 9;

const $ = id => document.getElementById(id);
let D = {}, ORDERED = [], filter = '전체', shown = PER;

/* 이모지 제거 (관리자에 이모지가 들어있어도 디자인은 깔끔하게) */
const noEmo = s => (s||'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,'').replace(/\s{2,}/g,' ').trim();
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ytId = u => { const m = (u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : ''; };

/* ---------- 작업물 순서: workSections 우선, 나머지는 뒤에 ---------- */
function buildOrder(){
  const works = D.works || [];
  const byId = new Map(works.map(w => [w.id, w]));
  const out = [], used = new Set();
  (D.workSections || []).forEach(sec => {
    (sec.workIds || []).forEach(id => {
      const w = byId.get(id);
      if (w && !used.has(id)) { out.push(w); used.add(id); }
    });
  });
  works.forEach(w => { if (!used.has(w.id)) out.push(w); });
  ORDERED = out.filter(w => ytId(w.url));
}

/* ---------- 상단 메뉴 ---------- */
function paintNav(){
  const n = D.nav || {};
  if (n.logo) $('logoBox').innerHTML = `<img src="${esc(n.logo)}" alt="덕선필름"><small>DUCKSUN FILM</small>`;
  const items = [
    { t: n.menu2 || '작업물', h: '#work' },
    { t: n.menu1 || '서비스', h: '#services' },
    { t: n.menu3 || '소개',   h: '#about' },
  ];
  (n.extraMenus || []).forEach(m => { if (m.name && m.url) items.push({ t: m.name, h: m.url, ext: true }); });
  const cta = { t: n.menu4 || '문의하기', h: '#contact' };

  $('navLinks').innerHTML =
    items.map(i => `<a href="${esc(i.h)}"${i.ext ? ' target="_blank" rel="noopener"' : ''}>${esc(noEmo(i.t))}</a>`).join('')
    + `<a href="${cta.h}" class="nav-cta">${esc(noEmo(cta.t))}</a>`;
  $('mmenu').innerHTML =
    items.concat([cta]).map(i => `<a href="${esc(i.h)}"${i.ext ? ' target="_blank" rel="noopener"' : ''}>${esc(noEmo(i.t))}</a>`).join('');
}

/* ---------- 히어로 ---------- */
function paintHero(){
  const h = D.hero || {};
  if (h.badge) $('heroBadge').textContent = noEmo(h.badge);
  if (h.title) $('heroTitle').textContent = h.title;
  if (h.desc)  $('heroDesc').textContent  = h.desc;

  const top = ORDERED[0];
  if (top) {
    const id = ytId(top.url);
    $('reel').style.display = '';
    $('reel').dataset.id = id;
    $('reel').dataset.t = top.name || '';
    $('reelImg').src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
    $('reelImg').onerror = function(){ this.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`; };
    $('reelTitle').textContent = noEmo(top.name || '');
  }

  const st = (D.about && D.about.stats) || [];
  const rows = st.map(s => ({ v: noEmo(s.num), l: s.label })).filter(s => s.v);
  if (rows.length < 4) rows.push({ v: '전국', l: '출장 촬영 가능' });
  $('stats').innerHTML = rows.slice(0,4).map(s =>
    `<div class="stat"><b>${esc(s.v)}</b><small>${esc(noEmo(s.l))}</small></div>`).join('');
}

/* ---------- 필터 · 그리드 ---------- */
function paintFilters(){
  const cats = (D.cats && D.cats.length) ? D.cats : ['전체'];
  $('filters').innerHTML = cats.map(c =>
    `<button data-c="${esc(c)}"${c === filter ? ' class="on"' : ''}>${esc(c === '전체' ? 'Show all' : c)}</button>`).join('');
}
function renderGrid(){
  const list = filter === '전체' ? ORDERED : ORDERED.filter(w => w.cat === filter);
  const note = (D.catMeta && D.catMeta[filter] && D.catMeta[filter].desc) || '';
  $('catNote').style.display = note ? '' : 'none';
  $('catNote').textContent = note;

  if (!list.length) { $('grid').innerHTML = '<p class="skel">등록된 작업물이 없습니다.</p>'; $('moreBtn').style.display = 'none'; return; }

  $('grid').innerHTML = list.slice(0, shown).map(w => {
    const id = ytId(w.url);
    return `<article class="card" data-id="${id}" data-t="${esc(w.name)}">
      <div class="card-thumb">
        <img loading="lazy" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="${esc(noEmo(w.name))}">
        <div class="card-ico"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <span class="tag">${esc(w.cat || '')}</span>
      <h3>${esc(noEmo(w.name))}</h3>
    </article>`;
  }).join('');
  $('moreBtn').style.display = list.length > shown ? '' : 'none';
}

/* ---------- 서비스 ---------- */
function paintSvc(){
  const list = D.services || [];
  $('svcList').innerHTML = list.map((s,i) => `
    <div class="svc rv">
      <div class="svc-no">${String(i+1).padStart(2,'0')}</div>
      <div>
        <h3>${esc(noEmo(s.name))}</h3>
        ${s.tag ? `<span class="svc-tag">${esc(noEmo(s.tag))}</span>` : ''}
      </div>
      <p>${esc(s.desc || '')}</p>
    </div>`).join('');
}

/* ---------- 소개 ---------- */
function paintAbout(){
  const a = D.about || {};
  $('aboutDesc').textContent = a.desc || '';
  const kit = (D.process || []).map(p =>
    `<div><span>${esc(noEmo(p.title))}</span><b>${esc(p.desc || '')}</b></div>`).join('');
  $('aboutKit').innerHTML = kit;
  $('aboutChips').innerHTML = (a.chips || []).map(c => `<li>${esc(noEmo(c))}</li>`).join('');
}

/* ---------- 문의 ---------- */
function paintContact(){
  const c = D.contact || {};
  if (c.title) $('ctTitle').textContent = c.title;
  if (c.sub)   $('ctSub').textContent   = c.sub;

  $('ctRows').innerHTML = (c.items || []).map(it => {
    const v = (it.val || '').trim(), label = esc(noEmo(it.label));
    let href = '';
    if (/^[\d\s\-+()]{8,}$/.test(v)) href = 'tel:' + v.replace(/[^\d+]/g,'');
    else if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) href = 'mailto:' + v;
    else if (/^@/.test(v)) href = 'https://instagram.com/' + v.slice(1);
    const inner = `<div><small>${label}</small><b>${esc(v)}</b></div>${href ? '<span class="arw">→</span>' : ''}`;
    return href
      ? `<a class="crow" href="${esc(href)}"${href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${inner}</a>`
      : `<div class="crow">${inner}</div>`;
  }).join('');

  const kakao = (D.nav && D.nav.extraMenus || []).find(m => /카카오/.test(m.name || ''));
  if (kakao && kakao.url) { $('ctKakao').href = kakao.url; $('ctKakao').style.display = ''; }
  if (D.footer && D.footer.copy) $('footCopy').textContent = noEmo(D.footer.copy);
}

/* ---------- 섹션 숨김 ---------- */
function applyVisibility(){
  const v = D.sectionVisibility || {};
  if (v.services === false) $('services').style.display = 'none';
  if (v.work === false)     $('work').style.display = 'none';
  if (v.about === false)    $('about').style.display = 'none';
  if (v.contact === false)  $('contact').style.display = 'none';
}

/* ---------- 모달 ---------- */
function openVideo(id, title){
  if (!id) return;
  $('mFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
  $('mTitle').textContent = noEmo(title || '');
  $('modal').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeVideo(){
  $('modal').classList.remove('on'); $('mFrame').src = '';
  document.body.style.overflow = '';
}
$('grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) openVideo(c.dataset.id, c.dataset.t);
});
$('reel').addEventListener('click', function(){ openVideo(this.dataset.id, this.dataset.t); });
$('mClose').onclick = closeVideo;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeVideo(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideo(); });

/* ---------- 인터랙션 ---------- */
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#filters button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); filter = b.dataset.c; shown = PER; renderGrid(); revealAll();
});
$('moreBtn').onclick = () => { shown += PER; renderGrid(); };
addEventListener('scroll', () => $('hdr').classList.toggle('solid', scrollY > 40), { passive:true });
$('burger').onclick = () => { $('burger').classList.toggle('on'); $('mmenu').classList.toggle('on'); };
$('mmenu').addEventListener('click', e => {
  if (e.target.tagName === 'A') { $('burger').classList.remove('on'); $('mmenu').classList.remove('on'); }
});

const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold:.1 });
function revealAll(){ document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el)); }

/* ---------- 시작 ---------- */
fetch(DATA_URL + '?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    D = d; buildOrder();
    paintNav(); paintHero(); paintFilters(); renderGrid();
    paintSvc(); paintAbout(); paintContact(); applyVisibility();
    revealAll();
  })
  .catch(() => {
    $('grid').innerHTML = '<p class="skel">작업물을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';
    revealAll();
  });
</script>
</body>
</html>
