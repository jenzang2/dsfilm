<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">덕선필름 | 전북 영상 촬영·편집</title>

<meta name="description" content="일반·드론 촬영부터 편집까지 직접 진행. 규모에 따라 다인 촬영팀 구성 가능. 전북 전주 기반, 전국 출장 가능합니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dsfilm.kr">
<meta property="og:title" content="덕선필름 | 행사·홍보·웨딩 영상 제작">
<meta property="og:description" content="일반·드론 촬영부터 편집까지 직접 진행. 규모에 따라 다인 촬영팀 구성 가능.">
<meta property="og:image" content="https://dsfilm.kr/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="canonical" href="https://dsfilm.kr/">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111111;
  --mid:#767676;
  --line:#e6e6e6;
  --wash:#f7f7f6;
  --max:1280px;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#fff;color:var(--ink);line-height:1.6;letter-spacing:-0.015em;
  overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.wrap{max-width:var(--max);margin:0 auto;padding:0 40px}
.display{font-weight:800;line-height:1.18;letter-spacing:-0.04em}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--mid);
}

/* ---------- NAV ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:90;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;transition:border-color .25s;
}
header.stuck{border-color:var(--line)}
.nav{max-width:var(--max);margin:0 auto;padding:0 40px;height:72px;
  display:flex;align-items:center;justify-content:space-between}
#logoBox{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-0.03em;font-size:17px}
#logoBox img{height:22px;width:auto}
#logoBox small{font-size:10px;font-weight:600;letter-spacing:0.16em;color:var(--light,#a3a3a3)}
#navLinks{display:flex;align-items:center;gap:30px;font-size:14.5px;font-weight:600}
#navLinks a{color:var(--mid);transition:color .18s}
#navLinks a:hover{color:var(--ink)}
.nav-cta{
  color:#fff!important;background:var(--ink);padding:10px 18px;border-radius:4px;
}
.burger{display:none;width:26px;height:18px;position:relative}
.burger i{position:absolute;left:0;right:0;height:2px;background:var(--ink);transition:.25s}
.burger i:nth-child(1){top:0}
.burger i:nth-child(2){top:8px}
.burger i:nth-child(3){top:16px}
body.menu-open .burger i:nth-child(1){top:8px;transform:rotate(45deg)}
body.menu-open .burger i:nth-child(2){opacity:0}
body.menu-open .burger i:nth-child(3){top:8px;transform:rotate(-45deg)}
#mmenu{
  position:fixed;inset:72px 0 auto 0;background:#fff;border-bottom:1px solid var(--line);
  padding:18px 40px 30px;display:none;flex-direction:column;gap:4px;z-index:89;
}
body.menu-open #mmenu{display:flex}
#mmenu a{padding:13px 0;font-size:17px;font-weight:700;border-bottom:1px solid var(--line)}

/* ---------- HERO ---------- */
.hero{padding:170px 0 0}
.hero-badge{margin-bottom:26px}
.hero .display{font-size:clamp(2.3rem,6.2vw,5rem);white-space:pre-line}
.hero-desc{margin-top:28px;max-width:560px;color:var(--mid);font-size:16.5px;line-height:1.85;white-space:pre-line}
.hero-btns{margin-top:40px;display:flex;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 26px;font-size:14.5px;font-weight:700;border-radius:4px;transition:.2s;
}
.btn-fill{background:var(--ink);color:#fff}
.btn-fill:hover{opacity:.82}
.btn-line{border:1px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}

/* ---------- REEL ---------- */
.reel{margin-top:72px;cursor:pointer}
.reel-media{
  position:relative;aspect-ratio:21/9;background:#0d0d0d;overflow:hidden;border-radius:4px;
}
.reel-media iframe,.reel-media video,.reel-media img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;
}
.reel-media iframe{
  width:100vw;height:56.25vw;min-height:100%;min-width:177.77vh;
  left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
}
.reel-media::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.18)}
.reel-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;transition:.25s;
}
.reel:hover .reel-play{transform:translate(-50%,-50%) scale(1.08)}
.reel-play svg{width:20px;height:20px;margin-left:3px;fill:#111}
.reel-txt{margin-top:16px;display:flex;justify-content:space-between;gap:20px;align-items:baseline}
#reelTitle{font-size:15px;font-weight:700;letter-spacing:-0.02em}
.reel-txt span{font-size:12.5px;color:var(--mid);white-space:nowrap}

/* ---------- STATS ---------- */
#stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  margin-top:88px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.stat{padding:30px 0;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-0.045em}
.stat small{display:block;margin-top:4px;font-size:12.5px;color:var(--mid)}

/* ---------- SECTION ---------- */
section{padding:120px 0}
.sect-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:46px;
}
.sect-head h2{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:800;letter-spacing:-0.04em}
.sect-head h2 em{font-style:normal;font-weight:500;color:var(--mid)}
.sect-head .eyebrow{margin-bottom:12px}

/* ---------- WORK ---------- */
#work{padding-top:40px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px}
.filters button{
  padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--mid);
  border:1px solid var(--line);border-radius:3px;transition:.18s;
}
.filters button:hover{color:var(--ink);border-color:#c9c9c9}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 26px}
.card{cursor:pointer}
.card-thumb{position:relative;aspect-ratio:16/9;background:#eee;overflow:hidden;border-radius:3px}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.card:hover .card-thumb img{transform:scale(1.045)}
.card-cat{margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mid);text-transform:uppercase}
.card-t{margin-top:7px;font-size:15px;font-weight:600;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more-wrap{margin-top:56px;text-align:center}
#moreBtn{padding:14px 34px;border:1px solid var(--line);border-radius:4px;font-size:14px;font-weight:700}
#moreBtn:hover{border-color:var(--ink)}
.empty{padding:40px 0;color:var(--mid);font-size:14px}

/* ---------- SERVICES ---------- */
#services{background:var(--wash)}
.srv{border-top:1px solid var(--line)}
.srv-row{display:grid;grid-template-columns:70px 1fr 1.25fr;gap:24px;
  padding:30px 0;border-bottom:1px solid var(--line);align-items:start}
.srv-no{font-size:13px;font-weight:700;color:var(--mid);letter-spacing:.06em;padding-top:4px}
.srv-t{font-size:19px;font-weight:800;letter-spacing:-0.035em}
.srv-d{color:var(--mid);font-size:15px;line-height:1.8;white-space:pre-line}

/* ---------- ABOUT ---------- */
.about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:70px;align-items:start}
.about-txt{font-size:16px;line-height:1.95;color:#3d3d3d;white-space:pre-line}
.tags{margin-top:30px;display:flex;flex-wrap:wrap;gap:7px}
.tags span{padding:7px 13px;border:1px solid var(--line);border-radius:3px;font-size:12.5px;color:var(--mid)}
.proc{border-top:1px solid var(--ink)}
.proc-row{display:flex;justify-content:space-between;gap:18px;padding:17px 0;border-bottom:1px solid var(--line)}
.proc-row b{font-size:14px;font-weight:700;white-space:nowrap}
.proc-row span{font-size:14px;color:var(--mid);text-align:right}

/* ---------- CONTACT ---------- */
#contact{background:var(--ink);color:#fff}
#contact .sect-head{border-color:rgba(255,255,255,.34)}
#contact .eyebrow{color:rgba(255,255,255,.55)}
.contact-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:start}
.contact-grid .display{font-size:clamp(1.95rem,4.4vw,3.4rem);white-space:pre-line}
.contact-sub{margin-top:22px;color:rgba(255,255,255,.64);font-size:15.5px;line-height:1.85;white-space:pre-line}
.crows{border-top:1px solid rgba(255,255,255,.22)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:19px 0;border-bottom:1px solid rgba(255,255,255,.22);transition:.2s}
.crow:hover{padding-left:6px}
.crow small{font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.5);text-transform:uppercase}
.crow b{font-size:16px;font-weight:700;letter-spacing:-0.02em}

/* ---------- FOOTER ---------- */
footer{padding:34px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--mid)}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.secret{cursor:default;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:color .2s}
.secret.hot{color:var(--ink)}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.93);
  display:none;align-items:center;justify-content:center;padding:24px}
#modal.on{display:flex}
.modal-in{width:100%;max-width:1100px}
.modal-box{position:relative;aspect-ratio:16/9;background:#000}
.modal-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#modalTitle{margin-top:14px;color:#fff;font-size:15px;font-weight:600}
#modalClose{position:absolute;top:20px;right:24px;color:#fff;font-size:30px;line-height:1}

/* ---------- REVEAL ---------- */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

/* ---------- RESPONSIVE ---------- */
@media (max-width:980px){
  .about-grid,.contact-grid{grid-template-columns:1fr;gap:44px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .srv-row{grid-template-columns:52px 1fr;}
  .srv-d{grid-column:2/3}
}
@media (max-width:720px){
  .wrap,.nav{padding-left:20px;padding-right:20px}
  #mmenu{padding-left:20px;padding-right:20px}
  #navLinks{display:none}
  .burger{display:block}
  .hero{padding-top:128px}
  section{padding:76px 0}
  .reel-media{aspect-ratio:16/9}
  #stats{grid-template-columns:repeat(2,1fr);margin-top:60px}
  .stat{padding:22px 0}
  .stat:nth-child(2n){border-right:none}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid{grid-template-columns:1fr;gap:30px}
  .sect-head{flex-direction:column;align-items:flex-start;gap:10px}
  .foot{flex-direction:column;gap:8px}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="nav">
    <a href="#top" id="logoBox">덕선필름</a>
    <nav id="navLinks"></nav>
    <button class="burger" id="burger" aria-label="메뉴"><i></i><i></i><i></i></button>
  </div>
</header>
<nav id="mmenu"></nav>

<a id="top"></a>

<!-- HERO -->
<div class="hero">
  <div class="wrap">
    <div class="eyebrow hero-badge" id="heroBadge">JEONBUK, KOREA</div>
    <h1 class="display" id="heroTitle">소중한 순간을
오래 기억되는
영상으로 만듭니다</h1>
    <p class="hero-desc" id="heroDesc"></p>
    <div class="hero-btns">
      <a href="#work" class="btn btn-fill">작업물 보기</a>
      <a href="#contact" class="btn btn-line">견적 문의</a>
    </div>

    <div class="reel rv" id="reel" style="display:none">
      <div class="reel-media" id="reelMedia"></div>
      <div class="reel-play">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="reel-txt">
        <strong id="reelTitle"></strong>

</div>

<!-- WORK -->
<section id="work">
  <div class="wrap">
    <div class="sect-head rv">
      <div>
        <div class="eyebrow">Selected Work</div>
        <h2>작업물 <em>/ Portfolio</em></h2>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="more-wrap"><button id="moreBtn" style="display:none">더 보기</button></div>
  </div>
</section>

<!-- SERVICES -->
<section id="services">
  <div class="wrap">
    <div class="sect-head rv">
      <div>
        <div class="eyebrow">What We Do</div>
        <h2>제작 범위 <em>/ Service</em></h2>
      </div>
    </div>
    <div class="srv" id="srvList"></div>
  </div>
</section>

<!-- ABOUT -->
<section id="about">
  <div class="wrap">
    <div class="sect-head rv">
      <div>
        <div class="eyebrow">About</div>
        <h2>덕선필름 <em>/ Studio</em></h2>
      </div>
    </div>
    <div class="about-grid rv">
      <div>
        <div class="about-txt" id="aboutTxt"></div>
        <div class="tags" id="aboutTags"></div>
      </div>

</section>

<!-- CONTACT -->
<section id="contact">
  <div class="wrap">

    <div class="contact-grid rv">
      <div>
        <h2 class="display" id="contactTitle">편하게 연락 주세요</h2>
        <p class="contact-sub" id="contactSub"></p>

    </div>
  </div>
</section>

<footer>
  <div class="wrap foot">
    <span id="copy">© 2026 덕선필름</span>
    <span class="secret" id="secretTap">전북 전주시 · 영상 촬영 및 제작</span>
  </div>
</footer>

<div id="modal">
  <button id="modalClose" aria-label="닫기">&times;</button>
  <div class="modal-in">
    <div class="modal-box" id="modalBox"></div>
    <div id="modalTitle"></div>
  </div>
</div>

<script>
const DATA_URL = 'dsfilm_data.json';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const noEmo = s => String(s==null?'':s).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,'').trim();
function ytId(u){
  if(!u) return '';
  const m = String(u).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}
function thumbOf(id){
  return `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
}
function linkOf(v){
  const s = String(v||'').trim();
  if(/^https?:\/\//i.test(s)) return s;
  if(s.includes('@') && !s.includes(' ')) return 'mailto:'+s;
  if(/^[0-9\-+\s()]{8,}$/.test(s)) return 'tel:'+s.replace(/[^0-9+]/g,'');
  return '';
}

let D = {}, ORDERED = [], CATS = [], curCat = '전체', shown = 0;
const PER = 6;

/* ---------- 데이터 로드 ---------- */
fetch(DATA_URL + '?t=' + Date.now())
  .then(r => r.json())
  .then(json => { D = json || {}; boot(); })
  .catch(() => {
    $('grid').innerHTML = '<div class="empty">작업물을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
  });

function boot(){
  buildOrder();
  paintNav();
  paintHero();
  paintWork();
  paintServices();
  paintAbout();
  paintContact();
  applyVisibility();
  initReveal();
}

/* ---------- 작업물 순서 ---------- */
function buildOrder(){
  ORDERED = (D.works || []).filter(w => ytId(w.url) || /\.mp4($|\?)/i.test(w.url || ''));
}

/* ---------- 상단 메뉴 ---------- */
function paintNav(){
  const n = D.nav || {};
  if(n.logo) $('logoBox').innerHTML = `<img src="${esc(n.logo)}" alt="덕선필름"><small>DUCKSUN FILM</small>`;
  const items = [
    { t: n.menu2 || '작업물', h: '#work' },
    { t: n.menu1 || '서비스', h: '#services' },
    { t: n.menu3 || '소개',   h: '#about' },
  ];
  (n.extraMenus || []).forEach(m => { if(m && m.name && m.url) items.push({ t:m.name, h:m.url, ext:true }); });
  const cta = { t: n.menu4 || '문의하기', h: '#contact' };

  $('navLinks').innerHTML =
    items.map(i => `<a href="${esc(i.h)}"${i.ext?' target="_blank" rel="noopener"':''}>${esc(noEmo(i.t))}</a>`).join('')
    + `<a href="${esc(cta.h)}" class="nav-cta">${esc(noEmo(cta.t))}</a>`;
  $('mmenu').innerHTML =
    items.concat([cta]).map(i => `<a href="${esc(i.h)}"${i.ext?' target="_blank" rel="noopener"':''}>${esc(noEmo(i.t))}</a>`).join('');
}

/* ---------- 히어로 ---------- */
function paintHero(){
  const h = D.hero || {}, m = D.heroMedia || {};
  if(h.badge) $('heroBadge').textContent = noEmo(h.badge);
  if(h.title) $('heroTitle').textContent = h.title;
  if(h.desc)  $('heroDesc').textContent  = h.desc;

  const top = ORDERED[0];
  const url   = (m.videoUrl || '').trim() || (top ? top.url : '');
  const title = (m.title || '').trim()    || (top ? (top.title || top.name || top.t || '') : '');
  const mode  = m.mode || 'thumb';
  const box = $('reel'), media = $('reelMedia');

  if(mode === 'none' || !url){ box.style.display = 'none'; return; }

  const id = ytId(url);
  box.style.display = '';
  box.dataset.id = id; box.dataset.t = title;

  if(mode === 'video' && /\.mp4($|\?)/i.test(url)){
    media.innerHTML = `<video src="${esc(url)}" autoplay muted loop playsinline${m.poster?` poster="${esc(m.poster)}"`:''}></video>`;
  } else if(mode === 'video' && id){
    media.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&modestbranding=1&rel=0&playsinline=1&disablekb=1&iv_load_policy=3" allow="autoplay; encrypted-media" tabindex="-1" aria-hidden="true"></iframe>`;
  } else if(id){
    media.innerHTML = `<img src="${thumbOf(id)}" onerror="this.onerror=null;this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'" alt="">`;
  }
  $('reelTitle').textContent = noEmo(title);

  const rows = ((D.about && D.about.stats) || [])
    .map(s => ({ v: noEmo(s.num || s.value || s.v || ''), l: s.label || s.l || '' }))
    .filter(s => s.v);
  if(rows.length && rows.length < 4) rows.push({ v:'전국', l:'출장 촬영 가능' });
  $('stats').innerHTML = rows.slice(0,4).map(s =>
    `<div class="stat"><b>${esc(s.v)}</b><small>${esc(noEmo(s.l))}</small></div>`).join('');
  $('stats').style.display = rows.length ? '' : 'none';
}

/* ---------- 작업물 ---------- */
function paintWork(){
  const seen = [];
  ORDERED.forEach(w => { const c = w.cat || '기타'; if(!seen.includes(c)) seen.push(c); });
  CATS = ['전체'].concat(seen);
  $('filters').innerHTML = CATS.map(c =>
    `<button data-c="${esc(c)}"${c===curCat?' class="on"':''}>${esc(noEmo(c))}</button>`).join('');
  $('filters').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      curCat = b.dataset.c; shown = PER;
      $('filters').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.c === curCat));
      paintGrid();
    };
  });
  shown = PER;
  paintGrid();
}
function listOf(){
  return curCat === '전체' ? ORDERED : ORDERED.filter(w => (w.cat || '기타') === curCat);
}
function paintGrid(){
  const list = listOf();
  if(!list.length){ $('grid').innerHTML = '<div class="empty">등록된 작업물이 없습니다.</div>'; $('moreBtn').style.display='none'; return; }
  $('grid').innerHTML = list.slice(0, shown).map(w => {
    const id = ytId(w.url);
    const t  = noEmo(w.title || w.name || w.t || '');
    return `<div class="card" data-id="${esc(id)}" data-t="${esc(t)}">
      <div class="card-thumb"><img src="${thumbOf(id)}" loading="lazy" alt=""
        onerror="this.onerror=null;this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'"></div>
      <div class="card-cat">${esc(noEmo(w.cat || ''))}</div>
      <div class="card-t">${esc(t)}</div>
    </div>`;
  }).join('');
  $('grid').querySelectorAll('.card').forEach(c => {
    c.onclick = () => openModal(c.dataset.id, c.dataset.t);
  });
  $('moreBtn').style.display = shown < list.length ? '' : 'none';
}
$('moreBtn').onclick = () => { shown += PER; paintGrid(); };

/* ---------- 서비스 ---------- */
function paintServices(){
  const list = D.services || [];
  $('srvList').innerHTML = list.map((s,i) =>
    `<div class="srv-row rv">
      <div class="srv-no">${String(i+1).padStart(2,'0')}</div>
      <div class="srv-t">${esc(noEmo(s.title || s.name || s.t || ''))}</div>
      <div class="srv-d">${esc(noEmo(s.desc || s.d || ''))}</div>
    </div>`).join('');
}

/* ---------- 소개 ---------- */
function paintAbout(){
  const a = D.about || {};
  $('aboutTxt').textContent = a.text || a.desc || a.intro || '';
  const tags = a.tags || a.clients || [];
  $('aboutTags').innerHTML = tags.map(t =>
    `<span>${esc(noEmo(typeof t === 'string' ? t : (t.name || t.t || '')))}</span>`).join('');
  const proc = a.process || [];
  $('procBox').innerHTML = proc.map(p =>
    `<div class="proc-row"><b>${esc(noEmo(p.title || p.t || ''))}</b><span>${esc(noEmo(p.desc || p.d || ''))}</span></div>`).join('');
  $('procBox').style.display = proc.length ? '' : 'none';
}

/* ---------- 문의 ---------- */
function paintContact(){
  const c = D.contact || {};
  if(c.title) $('contactTitle').textContent = c.title;
  if(c.desc || c.sub) $('contactSub').textContent = c.desc || c.sub;

  let rows = [];
  const src = Array.isArray(c) ? c : (Array.isArray(c.items) ? c.items : null);
  if(src){
    rows = src.map(x => ({ l: x.label || x.name || x.t || '', v: x.value || x.url || x.v || '' }));
  } else {
    const names = { phone:'전화', tel:'전화', email:'이메일', mail:'이메일', kakao:'카카오톡',
                    youtube:'유튜브', instagram:'인스타그램', address:'위치', hours:'상담 시간' };
    Object.keys(c).forEach(k => {
      if(names[k] && typeof c[k] === 'string' && c[k].trim()) rows.push({ l: names[k], v: c[k].trim() });
    });
  }
  const kakao = (D.nav && D.nav.extraMenus || []).find(m => m && /카카오/.test(m.name || ''));
  if(kakao && !rows.some(r => /카카오/.test(r.l))) rows.push({ l:'카카오톡', v: kakao.url });

  $('crows').innerHTML = rows.filter(r => r.v).map(r => {
    const href = linkOf(r.v);
    const ext = /^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : '';
    const inner = `<small>${esc(noEmo(r.l))}</small><b>${esc(noEmo(r.v))}</b>`;
    return href ? `<a class="crow" href="${esc(href)}"${ext}>${inner}</a>`
                : `<div class="crow">${inner}</div>`;
  }).join('');

  if(D.footer && D.footer.copy) $('copy').textContent = noEmo(D.footer.copy);
}

/* ---------- 섹션 표시 ---------- */
function applyVisibility(){
  const v = D.sectionVisibility || {};
  [['work','work'],['services','services'],['about','about'],['contact','contact']].forEach(([key,id]) => {
    if(v[key] === false){ const el = $(id); if(el) el.style.display = 'none'; }
  });
}

/* ---------- 모달 ---------- */
function openModal(id, t){
  if(!id) return;
  $('modalBox').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  $('modalTitle').textContent = t || '';
  $('modal').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  $('modal').classList.remove('on');
  $('modalBox').innerHTML = '';
  document.body.style.overflow = '';
}
$('modalClose').onclick = closeModal;
$('modal').onclick = e => { if(e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
$('reel').onclick = () => openModal($('reel').dataset.id, $('reel').dataset.t);

/* ---------- 메뉴 / 스크롤 ---------- */
$('burger').onclick = () => document.body.classList.toggle('menu-open');
$('mmenu').addEventListener('click', e => { if(e.target.tagName === 'A') document.body.classList.remove('menu-open'); });
addEventListener('scroll', () => { $('hdr').classList.toggle('stuck', scrollY > 10); });

/* ---------- 등장 효과 ---------- */
function initReveal(){
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll('.rv').forEach(el => io.observe(el));
}

/* ---------- 푸터 숨은 진입 ---------- */
(function(){
  const el = $('secretTap');
  const base = el.textContent;
  let n = 0, timer = null;
  const WINDOW = 2500;
  el.addEventListener('click', () => {
    n++;
    clearTimeout(timer);
    if(n >= 5){
      el.textContent = '관리자 모드로 이동합니다';
      el.classList.add('hot');
      setTimeout(() => { location.href = 'dsfilm_admin_v5.html'; }, 350);
      return;
    }
    if(n >= 3){ el.textContent = `관리자 모드까지 ${5 - n}회`; el.classList.add('hot'); }
    timer = setTimeout(() => { n = 0; el.textContent = base; el.classList.remove('hot'); }, WINDOW);
  });
})();
</script>
